name: Validate Marvel Tracker

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/marvel.json"
      - "requirements.txt"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate JSON catalog
        run: python -m json.tool data/marvel.json > /dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
