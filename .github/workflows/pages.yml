name: Marvel Tracker - aggiornamento e pubblicazione

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "data/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: marvel-tracker-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Update Marvel catalog with Gemini and Google Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python scripts/update_marvel.py
      - name: Commit refreshed data
        run: |
          if ! git diff --quiet -- data/marvel.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/marvel.json
            git commit -m "chore: refresh Marvel updates"
            git push
          else
            echo "No catalog changes to commit."
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
