<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e62429"><meta name="description" content="Marvel Tracker: film, serie e aggiornamenti verificati."><title>Marvel Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#17171c;--panel2:#202027;--text:#f5f5f7;--muted:#a4a4ad;--red:#e62429;--border:#303038}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b0b0d,#0b0b0d 45%);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}.container{width:min(1000px,100%);margin:auto;padding:20px 16px 50px}.hero{text-align:center;padding:20px 0}.hero h1{margin:0;color:var(--red);font-size:clamp(30px,6vw,46px);text-transform:uppercase}.muted,.phase-meta,.status{color:var(--muted)}.login{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#0b0b0df5}.loginbox,.phase,.news{background:var(--panel);border:1px solid var(--border);border-radius:17px}.loginbox{width:min(420px,100%);padding:24px;text-align:center}.loginbox h2{color:var(--red)}.loginbox input,.search{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text)}button{cursor:pointer;border:1px solid var(--border);border-radius:11px;padding:10px 13px;background:var(--panel2);color:var(--text)}button.primary,.active{background:var(--red);border-color:var(--red);color:#fff}.loginbox button{width:100%;margin-top:10px}.code{font-size:27px;font-weight:800;letter-spacing:5px;padding:12px}.progress{position:sticky;top:0;z-index:5;padding:14px;margin:8px 0 16px;background:#101014ed;border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(10px)}.bar{height:8px;background:#303038;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:var(--red)}.switch,.filters,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls .search{flex:1;min-width:200px}.phase{margin:10px 0;overflow:hidden}.phasehead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px}.phasehead button{white-space:nowrap}.phasebody{padding:0 10px 10px}.item{display:flex;align-items:center;gap:12px;padding:12px;margin:7px 0;border-radius:12px;background:var(--panel2);border:1px solid #2b2b32}.item input{width:22px;height:22px;accent-color:var(--red);flex-shrink:0}.item span:nth-child(2){flex:1}.item.done span:nth-child(2){text-decoration:line-through;color:var(--muted)}.badge{font-size:10px;text-transform:uppercase;color:#ccc;background:#33333b;border-radius:99px;padding:4px 7px}.news{padding:14px;margin:12px 0}.news a{color:#f5a1a3;overflow-wrap:anywhere}.news small{display:block;color:var(--muted)}.status{text-align:center;font-size:13px;min-height:20px;margin-top:12px}.hidden{display:none!important}.empty{text-align:center;padding:24px;color:var(--muted)}@media(max-width:560px){.phasehead{align-items:flex-start}.item{gap:8px;padding:10px}.badge{font-size:9px}}
</style></head><body>
<section id="login" class="login"><div class="loginbox"><h2>Marvel Tracker</h2><p class="muted">Crea un profilo protetto e ricevi un codice personale di 6 caratteri. Il profilo resta associato a questo browser.</p><div id="newbox"><button id="create" class="primary">Crea il mio codice</button></div><p id="loginerror" class="status"></p></div></section>
<main id="app" class="container hidden"><header class="hero"><h1>Marvel Tracker</h1><p class="muted">Film, serie e aggiornamenti Marvel con fonti verificabili</p><small class="muted">Il tuo codice personale: <b id="profile"></b></small></header>
<section class="progress"><div style="display:flex;justify-content:space-between;gap:10px"><b>Completamento</b><b id="progressText">0% · 0/0</b></div><div class="bar"><div id="progressFill" class="fill"></div></div></section>
<div class="switch"><button class="order active" data-order="marvel">Ordine Marvel</button><button class="order" data-order="release">Ordine di uscita</button></div><div class="controls"><input id="search" class="search" type="search" placeholder="Cerca un film o una serie…"><div class="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="film">Film</button><button class="filter" data-filter="serie">Serie</button></div></div>
<p id="updated" class="muted"></p><section id="news"></section><section id="content"></section><p id="empty" class="empty hidden">Nessun titolo trovato.</p><button id="reset" style="width:100%">Azzera tutti i progressi</button><p id="status" class="status" role="status"></p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getDatabase,ref,get,set,update} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import {getAuth,signInAnonymously,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyAoLV9f20TtIsC5RgBYr5Pq0ykIVyZ5i_M",authDomain:"marvel-tracker-c2402.firebaseapp.com",databaseURL:"https://marvel-tracker-c2402-default-rtdb.europe-west1.firebasedatabase.app",projectId:"marvel-tracker-c2402",storageBucket:"marvel-tracker-c2402.firebasestorage.app",messagingSenderId:"229267443330",appId:"1:229267443330:web:5c85140e9056d2ec3e2e9b",measurementId:"G-2QZEN4PB36"};
const appFirebase=initializeApp(firebaseConfig),db=getDatabase(appFirebase),auth=getAuth(appFirebase),STORAGE="marvel_tracker_auth_uid",CODE_STORAGE="marvel_tracker_profile_code";
let code=null,profileCode=null,profileLabel=null,catalog={orders:{marvel:{sections:[]},release:{sections:[]}},sourceUpdates:[],researchUpdates:[]},progress={},order="marvel",filter="all",query="";
const $=id=>document.getElementById(id),slug=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function status(s){$("status").textContent=s}function progressRef(){return ref(db,"users/"+code+"/progress")}
async function ensureAnonymousAuth(){await setPersistence(auth,browserLocalPersistence);if(!auth.currentUser)await signInAnonymously(auth);code=auth.currentUser.uid;return code}
function makeCode(){const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=chars[crypto.getRandomValues(new Uint32Array(1))[0]%chars.length];return s}
async function enter(uid,label,shortCode){code=uid;profileCode=shortCode||localStorage.getItem(CODE_STORAGE)||null;profileLabel=label||("Profilo "+(profileCode||uid.slice(0,6)));localStorage.setItem(STORAGE,uid);if(profileCode)localStorage.setItem(CODE_STORAGE,profileCode);$("login").classList.add("hidden");$("app").classList.remove("hidden");$("profile").textContent=profileCode||profileLabel;try{const snap=await get(progressRef());progress=snap.exists()?snap.val()||{}:{}}catch(e){status("Impossibile sincronizzare i progressi: "+e.message)}await loadCatalog()}
$("create").onclick=async()=>{try{$("loginerror").textContent="Creo il profilo sicuro…";await ensureAnonymousAuth();const userRef=ref(db,"users/"+code);const existing=await get(userRef);if(existing.exists()){const saved=existing.val()||{};profileCode=saved.profileCode||localStorage.getItem(CODE_STORAGE);if(!profileCode){let candidate;do{candidate=makeCode();const taken=await get(ref(db,"profileCodes/"+candidate));if(!taken.exists())break}while(true);profileCode=candidate;await set(ref(db,"profileCodes/"+profileCode),{uid:code,createdAt:new Date().toISOString()});await update(userRef,{profileCode})}}else{let candidate;do{candidate=makeCode();const taken=await get(ref(db,"profileCodes/"+candidate));if(!taken.exists())break}while(true);profileCode=candidate;await set(userRef,{createdAt:new Date().toISOString(),progress:{},profileCode});await set(ref(db,"profileCodes/"+profileCode),{uid:code,createdAt:new Date().toISOString()})}localStorage.setItem(CODE_STORAGE,profileCode);await enter(code,"Profilo personale",profileCode)}catch(e){$("loginerror").textContent="Errore Firebase: "+e.message+" — controlla Anonymous e le regole Realtime Database."}};

async function loadCatalog(){try{const r=await fetch("./data/marvel.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json();if(!j.orders?.marvel?.sections||!j.orders?.release?.sections)throw Error("Formato catalogo non valido");catalog=j;$("updated").textContent="Catalogo aggiornato: "+(j.updatedAt?new Date(j.updatedAt).toLocaleString("it-IT"):"in attesa del primo aggiornamento automatico");renderNews();render();status("Catalogo caricato ✓")}catch(e){console.error(e);status("Errore nel catalogo: "+e.message)}}
function allSections(){const base=catalog.orders?.[order]?.sections||[];const extras=(catalog.sourceUpdates||[]).length?[{saga:"Novità individuate dalle fonti",phase:"Nuovi titoli",items:catalog.sourceUpdates}]:[];return [...base,...extras]}
function renderNews(){const items=catalog.researchUpdates||[];$("news").replaceChildren();if(!items.length)return;const h=document.createElement("h2");h.textContent="Ultime notizie Marvel verificate";$("news").append(h);items.slice(0,12).forEach(n=>{const box=document.createElement("article");box.className="news";const title=document.createElement("b");title.textContent=n.title||"Aggiornamento Marvel";box.append(title);if(n.summary){const p=document.createElement("p");p.textContent=n.summary;box.append(p)}if(n.date){const d=document.createElement("small");d.textContent="Data: "+n.date;box.append(d)}(n.sources||[]).slice(0,4).forEach(s=>{if(!s.url||!/^https?:\/\//i.test(s.url))return;const a=document.createElement("a");a.href=s.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=s.title||s.url;const p=document.createElement("p");p.append(a);box.append(p)});$("news").append(box)})}
function render(){const root=$("content");root.replaceChildren();let count=0;for(const section of allSections()){const items=(section.items||[]).filter(x=>(filter==="all"||x.type===filter)&&(!query||(x.title||"").toLowerCase().includes(query)));if(!items.length)continue;count+=items.length;const wrap=document.createElement("section");wrap.className="phase";const head=document.createElement("div");head.className="phasehead";const label=document.createElement("div");const title=document.createElement("b");title.textContent=section.phase||"Marvel";const meta=document.createElement("div");meta.className="phase-meta";meta.textContent=items.filter(x=>progress[slug(x.title)]===true).length+"/"+items.length+" completati";label.append(title,meta);const toggle=document.createElement("button");toggle.textContent="Apri / chiudi";const body=document.createElement("div");body.className="phasebody hidden";toggle.onclick=()=>body.classList.toggle("hidden");const select=document.createElement("button");select.textContent="Seleziona tutti";select.onclick=async()=>{const target=items.some(x=>progress[slug(x.title)]!==true),changes={};items.forEach(x=>changes[slug(x.title)]=target);progress={...progress,...changes};try{await update(progressRef(),changes);render();status("Progressi sincronizzati ✓")}catch(e){status("Errore Firebase: "+e.message)}};head.append(label,toggle,select);wrap.append(head,body);items.forEach(item=>{const row=document.createElement("label");row.className="item";if(progress[slug(item.title)]===true)row.classList.add("done");const check=document.createElement("input");check.type="checkbox";check.checked=progress[slug(item.title)]===true;const name=document.createElement("span");name.textContent=item.title;const badge=document.createElement("span");badge.className="badge";badge.textContent=item.type==="serie"?"Serie":"Film";check.onchange=async()=>{const value=check.checked;progress[slug(item.title)]=value;row.classList.toggle("done",value);try{await update(progressRef(),{[slug(item.title)]:value});status("Progressi sincronizzati ✓")}catch(e){status("Errore Firebase: "+e.message)}updateProgress()};row.append(check,name,badge);body.append(row)});root.append(wrap)}$("empty").classList.toggle("hidden",count>0);updateProgress()}
function updateProgress(){const items=allSections().flatMap(s=>s.items||[]),done=items.filter(i=>progress[slug(i.title)]===true).length,pct=items.length?Math.round(done/items.length*100):0;$("progressText").textContent=pct+"% · "+done+"/"+items.length;$("progressFill").style.width=pct+"%"}
document.querySelectorAll(".order").forEach(b=>b.onclick=()=>{document.querySelectorAll(".order").forEach(x=>x.classList.toggle("active",x===b));order=b.dataset.order;render()});document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));filter=b.dataset.filter;render()});$("search").oninput=e=>{query=e.target.value.trim().toLowerCase();render()};$("reset").onclick=async()=>{if(!confirm("Vuoi davvero azzerare tutti i progressi di questo profilo?"))return;try{await set(progressRef(),{});progress={};render();status("Progressi azzerati.")}catch(e){status("Errore Firebase: "+e.message)}};
try{await ensureAnonymousAuth();const saved=localStorage.getItem(STORAGE);if(saved){const snap=await get(ref(db,"users/"+saved));if(snap.exists()){const savedData=snap.val()||{};await enter(saved,"Profilo personale",savedData.profileCode||localStorage.getItem(CODE_STORAGE))}else{localStorage.removeItem(STORAGE);localStorage.removeItem(CODE_STORAGE)}}}catch(e){console.error(e);$("loginerror").textContent="Impossibile autenticarsi: "+e.message+" — abilita il provider Anonymous in Firebase Authentication."}
</script></body></html>
